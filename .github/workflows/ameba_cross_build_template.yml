name: Unified Cross Platform and Shell Build Template

on:
  workflow_call:
    inputs:
      ic_name:
        required: true
        type: string
      build_stage_name:
        required: true
        type: string

jobs:
  cross-platform-build:
    runs-on: ${{ matrix.os }}
    env:
      SOC_MAP_JSON: '{"amebalite":"RTL8726E","amebasmart":"RTL8730E","amebadplus":"RTL8721Dx","amebagreen2":"RTL8721F", "RTL8720F":"RTL8720F"}'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash

          - os: windows-latest
            shell: cmd

          - os: windows-latest
            shell: powershell

          # - os: macos-latest
          #   shell: bash

#          - os: windows-latest
#            shell: bash


    steps:
    - uses: actions/checkout@v4

    - name: Json file parser
      id: build_config
      shell: bash
      run: |
        # 检查文件是否存在
        JSON_FILE=.github/workflows/ameba_build_config.json
        if [ ! -f "$JSON_FILE" ]; then
          echo "::error file=ameba_build_config.json::配置文件不存在"
          exit 1
        fi

        # 验证JSON格式
        if ! jq empty $JSON_FILE; then
          echo "::error file=$JSON_FILE::无效的JSON格式"
          exit 1
        fi

        # 提取嵌套数据
        echo "ic ${{ inputs.ic_name }} "
        echo "ic ${{ inputs.build_stage_name }} "
        echo "ic ${{ github.event.inputs.build_stage_name }} "
        BUILD_CONFIG=$(
          jq -r \
            --arg ic "${{ inputs.ic_name }}" \
            --arg stage "${{ inputs.build_stage_name }}" \
            --arg prefix "tools/scripts/daily_build_tool/${{ inputs.ic_name }}/" \
            '
            .[$ic][$stage] as $v
            | if $v == null or ($v | type) != "string" then
                ""
              else
                ($v
                | split(" ")
                | map(select(length > 0))
                | map($prefix + .)
                | join(" "))
              end
            ' "$JSON_FILE"
        )

        echo "build_config=$BUILD_CONFIG" >> $GITHUB_OUTPUT
        echo "SOC_NAME=${{ fromJson(env.SOC_MAP_JSON)[inputs.ic_name] }}" >> $GITHUB_ENV

    - name: Platform prepare, Menuconfig and Build (Unix)
      if: ${{ matrix.os != 'windows-latest' }}
      shell: bash
      run: |
        # === Setup ===
        shopt -s expand_aliases
        export USE_SECOND_SOURCE=True
        source env.sh

        # === Menuconfig ===
        if [ "${{ inputs.build_stage_name }}" != "B0" ]; then
          echo "Menuconfig ${{ inputs.ic_name }} stage ${{ inputs.build_stage_name }} build config ${{ steps.build_config.outputs.build_config }}"
          ameba.py menuconfig ${{ env.SOC_NAME }} -f ${{ steps.build_config.outputs.build_config }}
        fi

        # === Build ===
        ameba.py build ${{ env.SOC_NAME }}

        # === Post-Build Cleanup ===
        ameba.py cleansoc ${{ env.SOC_NAME }}

    - name: Platform prepare and setup (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: bash
      run: |
        export USE_SECOND_SOURCE=True
        cmd /c env.bat
        PREBUILTS_VERSION=$(grep -m1 'PREBUILTS_VERSION=' env.bat | sed 's/.*PREBUILTS_VERSION=\(.*\)/\1/' | tr -d '"\r')
        PREBUILTS_DIR="C:/rtk-toolchain/prebuilts-win-${PREBUILTS_VERSION}"
        echo "${PREBUILTS_DIR}/bin" >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/cmake/bin" >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/python3" >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/python3/Scripts" >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/make" >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/winpty" >> "$GITHUB_PATH"
        echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"

    - name: Menuconfig (Windows)
      if: ${{ matrix.os == 'windows-latest' && inputs.build_stage_name != 'B0' }}
      shell: ${{ matrix.shell }}
      run: |
        echo "Menuconfig Current shell is ${{ matrix.shell }}"
        echo "${{ inputs.ic_name }} stage ${{ inputs.build_stage_name }} build config ${{ steps.build_config.outputs.build_config }}"
        python ameba.py menuconfig ${{ env.SOC_NAME }} -f ${{ steps.build_config.outputs.build_config }}

    - name: Build (Windows)
      id: build_win
      if: ${{ matrix.os == 'windows-latest' && inputs.ic_name != 'amebasmart' }}
      shell: ${{ matrix.shell }}
      run: |
        echo "Build Current shell is ${{ matrix.shell }}"
        python ameba.py build ${{ env.SOC_NAME }}

    - name: Post-Build Cleanup (Windows)
      if: ${{ steps.build_win.outcome == 'success' }}
      shell: ${{ matrix.shell }}
      run: |
        echo "Post-Build Current shell is ${{ matrix.shell }}"
        python ameba.py cleansoc ${{ env.SOC_NAME }}
