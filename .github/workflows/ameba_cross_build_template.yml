name: Unified Cross Platform and Shell Build Template

on:
  workflow_call:
    inputs:
      ic_name:
        required: true
        type: string
      build_stage_name:
        required: true
        type: string

jobs:
  cross-platform-build:
    runs-on: ${{ matrix.os }}
    env:
      SOC_MAP_JSON: '{"amebalite":"RTL8726E","amebasmart":"RTL8730E","amebadplus":"RTL8721Dx","amebagreen2":"RTL8721F", "RTL8720F":"RTL8720F"}'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash

          - os: windows-latest
            shell: cmd

          - os: windows-latest
            shell: powershell

          # - os: macos-latest
          #   shell: bash

    steps:
    - uses: actions/checkout@v4

    # ── Json file parser ────────────────────────────────────────────────────────
    - name: Json file parser
      id: build_config
      shell: bash
      run: |
        JSON_FILE=.github/workflows/ameba_build_config.json
        if [ ! -f "$JSON_FILE" ]; then
          echo "::error file=ameba_build_config.json::配置文件不存在"
          exit 1
        fi
        if ! jq empty $JSON_FILE; then
          echo "::error file=$JSON_FILE::无效的JSON格式"
          exit 1
        fi
        echo "ic ${{ inputs.ic_name }} "
        echo "ic ${{ inputs.build_stage_name }} "
        BUILD_CONFIG=$(
          jq -r \
            --arg ic "${{ inputs.ic_name }}" \
            --arg stage "${{ inputs.build_stage_name }}" \
            --arg prefix "tools/scripts/daily_build_tool/${{ inputs.ic_name }}/" \
            '
            .[$ic][$stage] as $v
            | if $v == null or ($v | type) != "string" then ""
              else ($v | split(" ") | map(select(length > 0)) | map($prefix + .) | join(" "))
              end
            ' "$JSON_FILE"
        )
        echo "build_config=$BUILD_CONFIG" >> $GITHUB_OUTPUT
        echo "SOC_NAME=${{ fromJson(env.SOC_MAP_JSON)[inputs.ic_name] }}" >> $GITHUB_ENV

    # ── Unix ────────────────────────────────────────────────────────────────────
    - name: Platform prepare, Menuconfig and Build (Unix)
      if: ${{ matrix.os != 'windows-latest' }}
      shell: bash
      run: |
        export USE_SECOND_SOURCE=True
        source env.sh

        if [ "${{ inputs.build_stage_name }}" != "B0" ]; then
          echo "Menuconfig ${{ inputs.ic_name }} stage ${{ inputs.build_stage_name }} build config ${{ steps.build_config.outputs.build_config }}"
          python ameba.py menuconfig ${{ env.SOC_NAME }} -f ${{ steps.build_config.outputs.build_config }}
        fi

        python ameba.py build ${{ env.SOC_NAME }}
        python ameba.py cleansoc ${{ env.SOC_NAME }}

    # ── Windows: 公共 setup（cmd 和 powershell 共享）─────────────────────────
    - name: Run env.bat (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: cmd
      run: |
        set USE_SECOND_SOURCE=True
        echo USE_SECOND_SOURCE=True>>%GITHUB_ENV%
        call env.bat

    - name: Export prebuilts PATH (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: bash
      run: |
        PREBUILTS_VERSION=$(grep -m1 'PREBUILTS_VERSION=' env.bat | sed 's/.*PREBUILTS_VERSION=\(.*\)/\1/' | tr -d '"\r')
        PREBUILTS_DIR="C:/rtk-toolchain/prebuilts-win-${PREBUILTS_VERSION}"
        echo "${PREBUILTS_DIR}/bin"            >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/cmake/bin"      >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/make"           >> "$GITHUB_PATH"
        echo "${PREBUILTS_DIR}/winpty"         >> "$GITHUB_PATH"
        echo "${GITHUB_WORKSPACE}/.venv/Scripts" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
        echo "PYTHONNOUSERSITE=True"           >> "$GITHUB_ENV"

    # ── Windows cmd ─────────────────────────────────────────────────────────────
    - name: Menuconfig (Windows cmd)
      if: ${{ matrix.shell == 'cmd' && inputs.build_stage_name != 'B0' }}
      shell: cmd
      run: |
        echo Menuconfig stage ${{ inputs.build_stage_name }} build config ${{ steps.build_config.outputs.build_config }}
        python ameba.py menuconfig ${{ env.SOC_NAME }} -f ${{ steps.build_config.outputs.build_config }}

    - name: Build (Windows cmd)
      id: build_win_cmd
      if: ${{ matrix.shell == 'cmd' && inputs.ic_name != 'amebasmart' }}
      shell: cmd
      run: python ameba.py build ${{ env.SOC_NAME }}

    - name: Post-Build Cleanup (Windows cmd)
      if: ${{ steps.build_win_cmd.outcome == 'success' }}
      shell: cmd
      run: python ameba.py cleansoc ${{ env.SOC_NAME }}

    # ── Windows powershell ───────────────────────────────────────────────────────
    - name: Menuconfig (Windows powershell)
      if: ${{ matrix.shell == 'powershell' && inputs.build_stage_name != 'B0' }}
      shell: powershell
      run: |
        Write-Host "Menuconfig stage ${{ inputs.build_stage_name }} build config ${{ steps.build_config.outputs.build_config }}"
        python ameba.py menuconfig ${{ env.SOC_NAME }} -f ${{ steps.build_config.outputs.build_config }}

    - name: Build (Windows powershell)
      id: build_win_ps
      if: ${{ matrix.shell == 'powershell' && inputs.ic_name != 'amebasmart' }}
      shell: powershell
      run: python ameba.py build ${{ env.SOC_NAME }}

    - name: Post-Build Cleanup (Windows powershell)
      if: ${{ steps.build_win_ps.outcome == 'success' }}
      shell: powershell
      run: python ameba.py cleansoc ${{ env.SOC_NAME }}
